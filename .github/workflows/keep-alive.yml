name: Supabase Keep-Alive

# Evita que el free tier de Supabase se auto-pause (se pausa tras 7 días sin actividad).
# Hace un ping de SOLO LECTURA. Costo: ~1 min/día de GitHub Actions (gratis).

on:
  schedule:
    # Todos los días a las 09:00 UTC. Margen enorme contra la ventana de 7 días,
    # aunque GitHub retrase/salte alguna ejecución bajo carga.
    - cron: '0 9 * * *'
  workflow_dispatch: {} # permite dispararlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ping Supabase (solo lectura)
        env:
          # Opcional: si definís estos Secrets en el repo, se usan; si no, el script
          # cae a los valores públicos del proyecto (la publishable key ya es pública).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/production-safe/keep-alive.mjs
