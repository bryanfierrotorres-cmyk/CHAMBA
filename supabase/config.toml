[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "10MiB"

[auth]
site_url = "exp://localhost:8081"
additional_redirect_urls = ["exp://localhost:8081", "chamba://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions.create-payment-intent]
verify_jwt = true

[functions.send-push-notification]
verify_jwt = false

[functions.notify-new-job]
verify_jwt = false
